<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>MJM Nursery | MPOB Certified Oil Palm Seedlings</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── SPLASH POSTER ── */
  #splash-poster {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(160deg, #1a1608 0%, #2c2210 30%, #3d321a 60%, #1a1608 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease-out;
    overflow: hidden;
  }
  #splash-poster.fade-out { opacity: 0; pointer-events: none; }

  .splash-countdown {
    position: absolute; top: 1.5rem; left: 1.5rem; z-index: 10;
    color: rgba(255,255,255,.35); font-size: 13px; font-weight: 500;
    letter-spacing: .08em; display: flex; align-items: center; gap: .5rem;
  }
  .splash-countdown-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.2);
    font-size: 14px; font-weight: 700; color: rgba(255,255,255,.5);
  }

  /* Golden shimmer background */
  .splash-shimmer {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(201,168,76,.15) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 30%, rgba(232,212,154,.08) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(201,168,76,.1) 0%, transparent 40%);
    animation: shimmerMove 8s ease-in-out infinite;
  }
  @keyframes shimmerMove {
    0%,100% { opacity: .6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* God rays */
  .splash-rays {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 700px; height: 700px; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(201,168,76,.2) 0%, transparent 60%);
    animation: raysRotate 15s linear infinite;
  }
  .splash-ray {
    position: absolute; top: 0; left: 50%; width: 2px; height: 50%;
    transform-origin: bottom center;
    background: linear-gradient(to top, transparent, rgba(232,212,154,.15), transparent);
  }
  @keyframes raysRotate { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes raysPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

  /* Sparkle particles */
  .splash-particle {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,212,154,.9), rgba(201,168,76,.3));
    animation: sparkleFloat 4s ease-in-out infinite;
  }
  @keyframes sparkleFloat {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    15% { opacity: .8; transform: translateY(-10px) scale(1); }
    85% { opacity: .2; }
    100% { transform: translateY(-150px) scale(0); opacity: 0; }
  }

  .splash-inner {
    text-align: center; position: relative; z-index: 2;
    animation: splashIn 1.2s ease-out;
    width: 100%; max-width: 700px; padding: 0 1rem;
  }
  @keyframes splashIn { from { opacity: 0; transform: scale(.85) translateY(30px); } to { opacity: 1; transform: none; } }

  .splash-logo {
    height: 140px; margin-bottom: .5rem;
    display: block; margin-left: auto; margin-right: auto;
    filter: drop-shadow(0 4px 20px rgba(201,168,76,.4));
    animation: logoGlow 3s ease-in-out infinite;
  }
  @keyframes logoGlow {
    0%,100% { filter: drop-shadow(0 4px 20px rgba(201,168,76,.3)); }
    50% { filter: drop-shadow(0 4px 30px rgba(201,168,76,.6)) drop-shadow(0 0 60px rgba(232,212,154,.2)); }
  }

  .splash-center { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin: 1rem 0; position: relative; }
  @media(max-width:600px) { .splash-center { flex-direction: column; gap: .5rem; } }

  /* PLACEHOLDER_TRUNCATED_RETRY_VIA_SCRIPT */
</style>
