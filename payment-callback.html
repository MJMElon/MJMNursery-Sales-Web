<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJM Nursery | Payment Status</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--green-dark:#2D4A30;--green-mid:#3E6B42;--green-pale:#C8DFC9;--gold:#C9A84C;--cream:#F7F3EC;--text-dark:#1A2E1B;--text-mid:#4A6B4C;--text-light:#8AAB8C;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}
.nav{background:var(--green-dark);padding:0 3rem;height:100px;display:flex;align-items:center;}
.nav img{height:90px;cursor:pointer;transition:transform .3s ease;}
.nav img:hover{transform:scale(2.5);z-index:100;position:relative;}
.wrap{max-width:560px;margin:3rem auto;padding:0 1.5rem;}
.card{background:#fff;border:1px solid var(--green-pale);border-radius:16px;padding:2.4rem 2rem;box-shadow:0 4px 16px rgba(0,0,0,.06);text-align:center;}
.icon-wrap{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:42px;}
.icon-success{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#15803d;animation:pop .4s ease-out;}
.icon-pending{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#a16207;}
.icon-fail{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#b91c1c;}
@keyframes pop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.title{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--text-dark);margin-bottom:.4rem;}
.subtitle{font-size:13px;color:var(--text-mid);margin-bottom:1.4rem;line-height:1.6;}
.detail-box{background:var(--cream);border:1px solid var(--green-pale);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.4rem;text-align:left;}
.detail-row{display:flex;justify-content:space-between;align-items:baseline;padding:.4rem 0;border-bottom:1px dashed rgba(200,223,201,.5);font-size:13px;}
.detail-row:last-child{border-bottom:none;}
.detail-label{color:var(--text-light);font-weight:500;}
.detail-value{color:var(--text-dark);font-weight:600;}
.detail-value.amount{color:var(--green-dark);font-size:15px;font-weight:700;}
.btn{display:inline-block;padding:.8rem 2rem;background:var(--green-dark);color:#fff;border:none;border-radius:10px;text-decoration:none;font-weight:600;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s;}
.btn:hover{background:var(--green-mid);}
.btn-secondary{background:transparent;color:var(--text-mid);border:1px solid var(--green-pale);}
.btn-secondary:hover{background:var(--cream);color:var(--text-dark);}
.btn-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;}
.countdown{margin-top:1rem;font-size:12px;color:var(--text-light);}
.countdown b{color:var(--green-dark);font-weight:700;}
.next-step{margin-top:1rem;padding:.85rem 1rem;background:rgba(45,74,48,.06);border-left:3px solid var(--green-dark);border-radius:8px;text-align:left;font-size:12px;color:var(--text-mid);line-height:1.6;}
.next-step b{color:var(--green-dark);font-weight:700;}
</style>
</head>
<body>

<div class="nav">
  <a href="index.html"><img src="https://cdn.store-assets.com/s/1408881/f/16655641.png" alt="MJM Nursery"></a>
</div>

<div class="wrap">
  <div class="card" id="result">
    <div class="icon-wrap icon-pending"><span>⏳</span></div>
    <div class="title">Verifying Payment...</div>
    <div class="subtitle">Please wait while we confirm your payment with the bank.</div>
  </div>
</div>

<script>
var SB_URL='https://kibqjztozokohqmhqqqf.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYnFqenRvem9rb2hxbWhxcXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzQzNjIsImV4cCI6MjA4OTgxMDM2Mn0.J7qJUZhWXYf5b9oey4wXJkjdi66jomEMw_NeV9NWF7M';
var _sb=supabase.createClient(SB_URL,SB_KEY);

function fmtRM(n){return'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// Parse Billplz redirect params
var params=new URLSearchParams(window.location.search);
var billplzPaid=params.get('billplz[paid]')==='true';
var billplzId=params.get('billplz[id]')||'';
var isCredit=params.get('credit')==='1'||sessionStorage.getItem('mjm_pay_credit')==='1';

// Recover order context from sessionStorage (set by payment.html before Billplz redirect)
var orderId=sessionStorage.getItem('mjm_pay_order_id')||'';
var orderNumber=sessionStorage.getItem('mjm_pay_order_number')||'';
var orderTotal=sessionStorage.getItem('mjm_pay_order_total')||'';
var orderEmail=sessionStorage.getItem('mjm_pay_email')||'';

function goPortal(){
  // Hand off to index.html portal route
  sessionStorage.setItem('mjm_last_page','portal');
  // Clean up payment context
  sessionStorage.removeItem('mjm_pay_order_id');
  sessionStorage.removeItem('mjm_pay_order_total');
  sessionStorage.removeItem('mjm_pay_order_number');
  sessionStorage.removeItem('mjm_pay_email');
  sessionStorage.removeItem('mjm_pay_credit');
  window.location.href='index.html';
}

function startCountdown(secs){
  var elT=document.getElementById('cd-secs');
  if(!elT)return;
  var t=secs;
  var iv=setInterval(function(){
    t--;
    if(elT)elT.textContent=t;
    if(t<=0){clearInterval(iv);goPortal();}
  },1000);
}

function renderSuccess(){
  var el=document.getElementById('result');
  var ordHtml='';
  var amountLabel=isCredit?'Charged to Credit Account':'Amount Paid';
  if(orderNumber||orderTotal||orderEmail){
    ordHtml=
      '<div class="detail-box">'+
        (orderNumber?'<div class="detail-row"><span class="detail-label">Order Number</span><span class="detail-value">'+escHtml(orderNumber)+'</span></div>':'')+
        (orderTotal?'<div class="detail-row"><span class="detail-label">'+amountLabel+'</span><span class="detail-value amount">'+fmtRM(orderTotal)+'</span></div>':'')+
        (orderEmail?'<div class="detail-row"><span class="detail-label">Confirmation sent to</span><span class="detail-value">'+escHtml(orderEmail)+'</span></div>':'')+
        (billplzId&&!isCredit?'<div class="detail-row"><span class="detail-label">Payment Ref</span><span class="detail-value" style="font-family:monospace;font-size:11px;">'+escHtml(billplzId)+'</span></div>':'')+
      '</div>';
  }
  var title=isCredit?'Order Confirmed on Credit':'Payment Successful!';
  var subtitle=isCredit
    ? 'Thank you. Your seedlings have been reserved on your credit account and the amount will appear on your monthly bill.'
    : 'Thank you. Your order has been confirmed and is being processed.';
  var nextStep=isCredit
    ? '<b>What\'s next?</b><br>This order has been added to your <b>monthly credit bill</b>. Stock is reserved now; you can book your collection slot once the seedlings mature. The MJM Nursery team will issue your monthly invoice at the start of next month.'
    : '<b>What\'s next?</b><br>Your seedlings will be ready around the maturity month shown on each line. Once your order is marked ready, you can <b>book a collection slot</b> from your customer portal.';
  el.innerHTML=
    '<div class="icon-wrap icon-success"><span>✓</span></div>'+
    '<div class="title">'+escHtml(title)+'</div>'+
    '<div class="subtitle">'+escHtml(subtitle)+'</div>'+
    ordHtml+
    '<div class="next-step">'+nextStep+'</div>'+
    '<div class="btn-row" style="margin-top:1.4rem;">'+
      '<button class="btn" onclick="goPortal()">View My Orders</button>'+
    '</div>'+
    '<div class="countdown">Auto-redirecting to your customer portal in <b id="cd-secs">6</b> seconds…</div>';
  startCountdown(6);
}

function renderFail(reason){
  var el=document.getElementById('result');
  el.innerHTML=
    '<div class="icon-wrap icon-fail"><span>!</span></div>'+
    '<div class="title">Payment Not Completed</div>'+
    '<div class="subtitle">'+escHtml(reason||'Your payment was not completed or is still being processed. You can retry from your customer portal, or switch to offline payment.')+'</div>'+
    (orderNumber?'<div class="detail-box"><div class="detail-row"><span class="detail-label">Order Number</span><span class="detail-value">'+escHtml(orderNumber)+'</span></div></div>':'')+
    '<div class="btn-row">'+
      '<button class="btn" onclick="goPortal()">Go to My Orders</button>'+
      '<a class="btn btn-secondary" href="index.html">Back to Shop</a>'+
    '</div>';
}

// Poll order until the server-side webhook flips payment_status to 'paid'.
// Signature verification + DB writes happen in billplz-webhook (Edge Function);
// this page only READS the order. Never trust the redirect URL alone.
async function pollPaid(maxAttempts){
  for(var i=0;i<maxAttempts;i++){
    try{
      var{data:ord}=await _sb.from('salesweb_customer_orders')
        .select('id,order_number,total,status')
        .eq('id',orderId).maybeSingle();
      if(ord){
        if(!orderNumber)orderNumber=ord.order_number||'';
        if(!orderTotal)orderTotal=ord.total||'';
        if(ord.status==='Paid'||ord.status==='Order Confirmed')return true;
      }
    }catch(e){console.warn('Poll error:',e);}
    await new Promise(function(r){setTimeout(r,2000);});
  }
  return false;
}

(async function(){
  // Credit account branch — order is already 'Order Confirmed' at insert time.
  if(isCredit){
    renderSuccess();
    return;
  }

  if(!billplzPaid){renderFail();return;}

  // Optimistically show "Payment Successful!" immediately — the customer just
  // came back from the bank, blocking on a DB poll feels broken.
  renderSuccess();

  // In the background, confirm the webhook has flipped status to paid. If after
  // ~30s it's still pending, show a soft note instead of blocking the redirect.
  if(orderId){
    var paid=await pollPaid(15);
    if(!paid){
      var note=document.querySelector('.next-step');
      if(note){note.innerHTML+='<br><br><span style="color:#a16207;"><b>Note:</b> Bank confirmation is taking a little longer than usual. Your customer portal will reflect the paid status within a few minutes.</span>';}
    }
  }
})();
</script>
</body>
</html>
