<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJM Nursery | MPOB Certified Oil Palm Seedlings</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── SPLASH POSTER ── */
  #splash-poster {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(160deg, #1a1608 0%, #2c2210 30%, #3d321a 60%, #1a1608 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease-out;
    overflow: hidden;
  }
  #splash-poster.fade-out { opacity: 0; pointer-events: none; }

  .splash-countdown {
    position: absolute; top: 1.5rem; left: 1.5rem; z-index: 10;
    color: rgba(255,255,255,.35); font-size: 13px; font-weight: 500;
    letter-spacing: .08em; display: flex; align-items: center; gap: .5rem;
  }
  .splash-countdown-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.2);
    font-size: 14px; font-weight: 700; color: rgba(255,255,255,.5);
  }

  /* Golden shimmer background */
  .splash-shimmer {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(201,168,76,.15) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 30%, rgba(232,212,154,.08) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(201,168,76,.1) 0%, transparent 40%);
    animation: shimmerMove 8s ease-in-out infinite;
  }
  @keyframes shimmerMove {
    0%,100% { opacity: .6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* God rays */
  .splash-rays {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 700px; height: 700px; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(201,168,76,.2) 0%, transparent 60%);
    animation: raysRotate 15s linear infinite;
  }
  .splash-ray {
    position: absolute; top: 0; left: 50%; width: 2px; height: 50%;
    transform-origin: bottom center;
    background: linear-gradient(to top, transparent, rgba(232,212,154,.15), transparent);
  }
  @keyframes raysRotate { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes raysPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

  /* Sparkle particles */
  .splash-particle {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,212,154,.9), rgba(201,168,76,.3));
    animation: sparkleFloat 4s ease-in-out infinite;
  }
  @keyframes sparkleFloat {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    15% { opacity: .8; transform: translateY(-10px) scale(1); }
    85% { opacity: .2; }
    100% { transform: translateY(-150px) scale(0); opacity: 0; }
  }

  .splash-inner {
    text-align: center; position: relative; z-index: 2;
    animation: splashIn 1.2s ease-out;
    width: 100%; max-width: 700px; padding: 0 1rem;
  }
  @keyframes splashIn { from { opacity: 0; transform: scale(.85) translateY(30px); } to { opacity: 1; transform: none; } }

  .splash-logo {
    height: 140px; margin-bottom: .5rem;
    display: block; margin-left: auto; margin-right: auto;
    filter: drop-shadow(0 4px 20px rgba(201,168,76,.4));
    animation: logoGlow 3s ease-in-out infinite;
  }
  @keyframes logoGlow {
    0%,100% { filter: drop-shadow(0 4px 20px rgba(201,168,76,.3)); }
    50% { filter: drop-shadow(0 4px 30px rgba(201,168,76,.6)) drop-shadow(0 0 60px rgba(232,212,154,.2)); }
  }

  .splash-center { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin: 1rem 0; position: relative; }
  @media(max-width:600px) { .splash-center { flex-direction: column; gap: .5rem; } }

  /* Floating feature boxes */
  .splash-feature {
    flex: 0 0 140px; text-align: center; padding: 1rem .8rem;
    background: rgba(201,168,76,.08); border: 1px solid rgba(201,168,76,.2);
    border-radius: 16px; backdrop-filter: blur(8px);
    animation: featureFloat 4s ease-in-out infinite;
  }
  .splash-feature:nth-child(1) { animation-delay: 0s; }
  .splash-feature:nth-child(3) { animation-delay: 1s; }
  @keyframes featureFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .splash-feature-icon { font-size: 1.4rem; margin-bottom: .4rem; letter-spacing: -1px; }
  .splash-feature-text {
    font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600;
    color: var(--gold-light); letter-spacing: .04em; line-height: 1.3;
  }

  /* Seedling center piece */
  .splash-plant { position: relative; flex: 0 0 auto; }
  .splash-seedling {
    height: 280px;
    filter: drop-shadow(0 0 40px rgba(201,168,76,.4)) drop-shadow(0 12px 30px rgba(0,0,0,.5));
    animation: seedlingFloat 3s ease-in-out infinite;
    position: relative; z-index: 2;
  }
  @keyframes seedlingFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .splash-glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,212,154,.2) 0%, rgba(201,168,76,.08) 40%, transparent 70%);
    animation: glowPulse 2.5s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: .5; } 50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; } }

  .splash-title {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(1.6rem, 5vw, 2.5rem);
    font-weight: 300; color: #fff; letter-spacing: .06em; margin-top: .5rem;
    text-shadow: 0 2px 20px rgba(0,0,0,.4);
  }
  .splash-award {
    display: inline-block; margin: .6rem auto 1rem;
    background: linear-gradient(135deg, rgba(201,168,76,.2), rgba(232,212,154,.1));
    border: 1.5px solid rgba(201,168,76,.35);
    color: var(--gold-light); font-size: 16px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    padding: .6rem 2rem; border-radius: 30px;
    backdrop-filter: blur(6px);
    text-shadow: 0 1px 8px rgba(201,168,76,.3);
  }

  :root {
    --green-dark:  #2D4A30;
    --green-mid:   #3E6B42;
    --green-light: #6A9B6E;
    --green-pale:  #C8DFC9;
    --gold:        #C9A84C;
    --gold-light:  #E8D49A;
    --cream:       #F7F3EC;
    --white:       #FFFFFF;
    --text-dark:   #1A2E1B;
    --text-mid:    #4A6B4C;
    --text-light:  #8AAB8C;
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text-dark); overflow-x: hidden; }

  /* ── PAGE SYSTEM ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--green-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 3rem; height: 144px; transition: box-shadow .3s;
  }
  nav.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,.3); }
  .nav-logo { display: flex; align-items: center; gap: .75rem; text-decoration: none; cursor: pointer; }
  .nav-logo-icon {
    width: 44px; height: 44px; border-radius: 8px; background: var(--green-mid);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0;
  }
  .nav-logo-icon .mjm { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--white); line-height: 1; }
  .nav-logo-icon .nursery-badge { background: var(--green-light); color: var(--white); font-size: 7px; font-weight: 500; letter-spacing: .08em; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
  .nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; margin-right: auto; margin-left: 2rem; }
  .nav-dropdown-wrap { position: relative; }
  .nav-dropdown-wrap > a { cursor: pointer; }
  .nav-dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: var(--green-dark); border-radius: 10px; min-width: 180px; padding: .4rem 0; box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 50; margin-top: 0; }
  .nav-dropdown-menu::before { content: ''; position: absolute; top: -.8rem; left: 0; right: 0; height: .8rem; }
  .nav-dropdown-wrap:hover .nav-dropdown-menu { display: block; }
  .nav-dropdown-menu a { display: block; padding: .6rem 1.2rem; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.8); cursor: pointer; transition: all .15s; text-decoration: none; letter-spacing: .05em; }
  .nav-dropdown-menu a:hover { background: rgba(255,255,255,.1); color: var(--gold-light); }
  .nav-links a { font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.8); text-decoration: none; transition: color .2s; cursor: pointer; }
  .nav-links a:hover, .nav-links a.active { color: var(--gold-light); }
  .nav-actions { display: flex; align-items: center; gap: 1.25rem; }
  .nav-actions a { color: rgba(255,255,255,.7); text-decoration: none; font-size: 13px; transition: color .2s; }
  .nav-actions a:hover { color: var(--white); }
  .btn-cart { background: var(--gold); color: var(--green-dark); border: none; padding: .5rem 1.25rem; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .2s; display: flex; align-items: center; gap: .4rem; }
  .btn-cart:hover { background: var(--gold-light); }
  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: .25rem; }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--white); margin: 4px 0; transition: .3s; }
